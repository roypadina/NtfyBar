name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Test
        run: swift test

      # RELEASE=1: universal, ad-hoc signed app + zip, the same artifact the Homebrew cask installs.
      - name: Package
        run: RELEASE=1 Scripts/package_app.sh
